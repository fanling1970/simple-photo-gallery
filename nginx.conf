worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    lua_package_path "/usr/share/nginx/lua/?.lua;;";

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # 登录/初始化页面开放
        location = /login.html {}
        location = /setup.html {}

        # 退出
        location = /api/logout {
            content_by_lua_block {
                ngx.header["Set-Cookie"] = "token=; Path=/; HttpOnly; Max-Age=0";
                return ngx.redirect("/login.html");
            }
        }

        # 所有 /api/ 接口统一交给 api.lua（含 /api/setup、/api/auth）
        location /api/ {
            content_by_lua_file /usr/share/nginx/lua/api.lua;
        }

        # 其余静态资源鉴权
        location / {
            access_by_lua_file /usr/share/nginx/lua/auth.lua;
            try_files $uri $uri/ =404;
        }
    }
}
