<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人服务器相册</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:16px;color:#fff;flex-wrap:wrap;position:sticky;top:0;z-index:800;background:#121212">
    <h1 style="margin:0">我的相册</h1>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button id="tabIndex" class="tabbtn active">索引图库</button>
      <button id="tabTimeline" class="tabbtn">时间线</button>
      <button id="uploadBtn" style="background:#2563eb;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer">上传图片</button>
      <span id="curUser"></span>
      <a href="/api/logout" style="color:#ff7070;text-decoration:none">退出登录</a>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
  </div>

  <main class="gallery-container" id="indexView"></main>
  <div id="timelineView" style="display:none"></div>

  <div class="lightbox" id="lightbox">
    <span class="close-btn" id="closeBtn">&times;</span>
    <img class="lightbox-img" id="lightboxImg" alt="preview">
  </div>

  <div id="timelineRail"></div>

  <script src="js/gallery.js"></script>
</body>
</html>
