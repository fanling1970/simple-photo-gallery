<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初始化管理员</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;color:#fff;font-family:system-ui,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}
.box{width:340px;padding:30px;background:#292929;border-radius:12px}
h2{text-align:center;margin-bottom:24px}
input{width:100%;margin:8px 0;padding:12px;border-radius:8px;border:none;font-size:16px;color:#111}
button{width:100%;padding:12px;margin-top:12px;background:#10b981;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
#msg{color:#f87171;margin-top:12px;text-align:center;min-height:20px}
</style>
</head>
<body>
<div class="box">
    <h2>首次部署 · 创建管理员账号</h2>
    <input type="text" id="user" placeholder="管理员用户名">
    <input type="password" id="pwd" placeholder="管理员密码(至少4位)">
    <button id="btn" onclick="setup()">创建账号并登录</button>
    <div id="msg"></div>
</div>
<script>
async function setup(){
    const btn=document.getElementById('btn'), msg=document.getElementById('msg');
    const u=document.getElementById('user').value.trim();
    const p=document.getElementById('pwd').value;
    msg.innerText='';
    if(!u || p.length<4){ msg.innerText='请输入用户名和至少4位密码'; return; }
    btn.disabled=true; btn.innerText='提交中...';
    try{
        const res=await fetch('/api/setup',{
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:'username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p)
        });
        const text=await res.text();
        let ret; try{ ret=JSON.parse(text); }catch(e){ ret={ok:false,msg:'响应异常: '+text}; }
        if(ret.ok){ location.href='/index.html'; } else { msg.innerText=ret.msg||'创建失败'; }
    }catch(e){ msg.innerText='请求失败: '+e.message; }
    finally{ btn.disabled=false; btn.innerText='创建账号并登录'; }
}
</script>
</body>
</html>
